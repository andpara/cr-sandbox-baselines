name: kali-2026-sandbox-demo

hosts:
  - name: kali-desktop
    base_box: 
      image: kali-2026-x86_64
      mgmt_user: debian
    flavor: c4_r4_d25

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: c1_r2_d10

networks:
  - name: network
    cidr: 10.0.0.0/24

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

net_mappings:
    - host: kali-desktop
      network: network
      ip: 10.0.0.10

router_mappings:
    - router: router
      network: network
      ip: 10.0.0.1

groups: []

